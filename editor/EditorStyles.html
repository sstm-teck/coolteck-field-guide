<style>
/* Editor-only pieces on top of the shared SSTM styles. */
.ar { font-family: "Noto Sans Arabic", Tahoma, Inter, sans-serif; direction: rtl; text-align: right; }
.publish-btn { position: relative; white-space: nowrap; }
.publish-btn .dot { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: #F59E0B; border: 2px solid #fff; }
.icon-btn svg { width: 18px; height: 18px; }

/* jobs and models grid */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tile { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; cursor: pointer; }
.tile:hover { border-color: #CBD5E1; }
.tile .pic { aspect-ratio: 4 / 3; background: var(--brand-soft); display: grid; place-items: center; color: var(--muted); }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; }
.tile .body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.tile .body .ar { font-size: 18px; font-weight: 700; }
.tile .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tile .order { display: flex; gap: 4px; margin-left: auto; }
.tile.hidden-job { opacity: .6; }

/* job / model header card */
.ed-head { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; }
.ed-fields { display: grid; gap: 14px; align-content: start; }
.ed-fields .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.ar-input { font-family: "Noto Sans Arabic", Tahoma, sans-serif; direction: rtl; text-align: right; font-size: 18px !important; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip.all.on { background: var(--green); border-color: var(--green); }
.switch-line { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; }
.switch { width: 38px; height: 22px; border-radius: 999px; background: #CBD5E1; position: relative; flex: none; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(16px); }
.switch.warn.on { background: var(--red); }

/* media slots */
.slot { border: 1px dashed #CBD5E1; border-radius: 12px; background: #FBFCFE; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; min-width: 0; }
.slot .s-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px 0; display: flex; justify-content: space-between; gap: 6px; }
.slot .s-view { display: grid; place-items: center; min-height: 96px; padding: 6px; }
.slot .s-view img, .slot .s-view video { max-width: 100%; max-height: 150px; border-radius: 8px; }
.slot .s-view audio { width: 100%; height: 36px; }
.slot .s-view .empty-ico { color: #CBD5E1; }
.slot .s-view .empty-ico svg { width: 34px; height: 34px; }
.slot .s-act { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-top: 1px solid var(--line-2); }
.slot .s-act .btn { flex: 1; justify-content: center; }
.slot.filled { border-style: solid; border-color: var(--line); background: #fff; }
.slot.uploading .s-act { opacity: .5; pointer-events: none; }
.up-prog { width: 100%; padding: 0 8px; display: grid; gap: 6px; }
.up-bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.up-bar span { display: block; height: 100%; background: var(--brand-2); border-radius: 999px; transition: width .3s; }
.up-txt { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center; }
.slot.big .s-view { min-height: 170px; }
.slot.big .s-view img { max-height: 200px; }
.rec-on { background: var(--red) !important; border-color: var(--red) !important; color: #fff !important; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .65; } }

/* steps */
.steps { display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0; overflow: hidden; }
.step.warn-step { border-color: #F5C2C2; }
.step .rail { background: var(--brand-soft); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; }
.step.warn-step .rail { background: var(--red-soft); }
.step .rail .n { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.step.warn-step .rail .n { background: var(--red); }
.step .content { padding: 14px; display: grid; gap: 12px; }
.step .media-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.step textarea.say { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 18px; font-weight: 600; background: #FBFCFE; resize: vertical; outline: none; }
.step textarea.say:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(35, 138, 203, .15); background: #fff; }
.step .opts { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.step .opts .lbl { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 6px; }
.step .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.add-step { border: 2px dashed #CBD5E1; background: none; border-radius: var(--radius); padding: 16px; font-weight: 700; color: var(--brand); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.add-step:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.add-step svg, .mini-btn svg { width: 16px; height: 16px; }
.saving-dot { font-size: 12px; color: var(--muted); }

/* settings */
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.set-grid .full { grid-column: 1 / -1; }
.prompt-row { display: grid; grid-template-columns: 1fr 280px; gap: 12px; align-items: start; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.ok-line { color: var(--green); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.ok-line svg { width: 16px; height: 16px; }
.steps-howto { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.steps-howto li { margin: 4px 0; }

@media (max-width: 900px) {
  .ed-head { grid-template-columns: 1fr; }
  .prompt-row, .set-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .step .media-row { grid-template-columns: 1fr; }
  .topbar-inner { gap: 10px; padding: 0 12px; }
  .brand-text { display: none; }
}
</style>
